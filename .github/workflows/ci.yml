name: CI

on:
  pull_request:
  push:
    branches: [main, "codex/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic:
    name: Deterministic checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Never select a developer profile or opt in to hardware/model fixtures.
      MOTIVE_TEST_ANDROID: "0"
      MOTIVE_TEST_ANDROID_HELPER: "0"
      MOTIVE_TEST_OLLAMA: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.22.0"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      # Explicit file list, not npm test: the full suite can operate real apps.
      - run: npm run test:ci
        env:
          MOTIVE_HOME: ${{ runner.temp }}/motive-ci
      - name: Audit root dependencies
        run: npm audit --audit-level=high
      - name: Audit desktop JavaScript dependencies
        working-directory: apps/desktop
        run: npm audit --package-lock-only --audit-level=high

[package]
name = "motive-win-uia"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Windows UI Automation sidecar for beacon-motive (newline-delimited JSON over stdio)"

[dependencies]
uiautomation = "0.25"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
strip = true
